<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="WuLiZeng banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="55%" stop-color="#12172e"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#ff2e88"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7df9ff"/>
      <stop offset="60%" stop-color="#b388ff"/>
      <stop offset="100%" stop-color="#ff8ac2"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7c4dff" stroke-opacity="0.10"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="250" fill="url(#bg)"/>
  <rect width="1000" height="250" fill="url(#grid)"/>
  <circle cx="120" cy="30" r="90" fill="#00e5ff" opacity="0.10"/>
  <circle cx="910" cy="230" r="110" fill="#ff2e88" opacity="0.10"/>

  <path d="M 24 24 h 28 M 24 24 v 28" stroke="#00e5ff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 976 24 h -28 M 976 24 v 28" stroke="#ff2e88" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 24 226 h 28 M 24 226 v -28" stroke="#ff2e88" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 976 226 h -28 M 976 226 v -28" stroke="#00e5ff" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <text x="66" y="76" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" fill="#8b949e">▸ <tspan fill="#00e5ff">~</tspan>/unluckynike <tspan fill="#ff2e88">$</tspan> ./init_profile.sh</text>

  <text x="66" y="150" filter="url(#glow)" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="58" font-weight="700" fill="url(#title)" letter-spacing="2">WuLiZeng</text>
  <rect x="372" y="104" width="14" height="46" fill="#00e5ff">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <text x="70" y="194" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="19" fill="#8b949e">// <tspan fill="#7df9ff">Java Backend</tspan> · <tspan fill="#b388ff">Python / ML</tspan> · <tspan fill="#ff8ac2">Chengdu, China</tspan></text>

  <rect x="24" y="238" width="952" height="3" fill="url(#accent)"/>
</svg>
